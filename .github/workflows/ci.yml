name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          # Placeholders that pass validation (src/lib/env.ts). The build only
          # checks their shape; nothing connects to them. Real values live in Vercel.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
          BETTER_AUTH_URL: http://localhost:3000

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      # Same major version as the Neon project
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migration files are consistent
        run: npm run db:check
      - name: Schema has no changes without a migration
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Every migration applies to an empty database
        run: npm run db:migrate
      - name: Migrations are idempotent on re-run
        run: npm run db:migrate
      - name: Database constraints hold
        run: npm run test:db
      - name: Seed data loads into a fresh database, twice
        run: npm run seed && npm run seed
