name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          # Placeholders that pass validation (src/lib/env.ts). The build only
          # checks their shape; nothing connects to them. Real values live in Vercel.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
          BETTER_AUTH_URL: http://localhost:3000

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # "demo" in the name lets the flows sign in with one-tap view-as.
          POSTGRES_DB: kickball_e2e_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      # Stripe's own mock API, so checkout runs without reaching Stripe.
      stripe:
        image: stripe/stripe-mock:v0.197.0
        ports: ["12111:12111"]
    env:
      # A throwaway database in the service container; playwright.config.ts
      # adds demo mode and placeholder Stripe test values for the flows server.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/kickball_e2e_demo
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
      BETTER_AUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - name: Smoke tests and core flows with axe (seeds the database first)
        run: npm run test:e2e
      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The seeded league behind the schedule, standings and team pages.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
      BETTER_AUTH_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run build
      - name: Performance and accessibility budgets (throttled phone)
        run: npm run lighthouse
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not just this commit
      - name: No tokens, keys or passwords anywhere in the history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      # Same major version as the Neon project
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migration files are consistent
        run: npm run db:check
      - name: Schema has no changes without a migration
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Every migration applies to an empty database
        run: npm run db:migrate
      - name: Migrations are idempotent on re-run
        run: npm run db:migrate
      - name: Database constraints hold
        run: npm run test:db
      - name: Seed data loads into a fresh database, twice
        run: npm run seed && npm run seed
