name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# How the jobs fit together (docs/architecture.md, section 11):
#
#   changes ─┬─ Lint, types, tests, build
#            ├─ Migrations
#            ├─ Production build for end-to-end ── End-to-end shards ── End-to-end
#            └─ Production build for Lighthouse ── Lighthouse shards ── Lighthouse
#   Secret scan
#
# The names in .github/rulesets/main.json are the required checks. The
# sharded work reports through one job with that exact name, so the ruleset
# never waits on a check that no longer exists.

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      # "false" only for a pull request whose every file is documentation.
      # Anything else, including a failure here, runs every check in full.
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's merge commit and its first parent, main.
          fetch-depth: 2
      - name: Does this change reach the app?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "app=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Everything this pull request would change on main.
          files=$(git diff --name-only HEAD^1 HEAD)
          app=false
          [ -n "$files" ] || app=true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              # Conservative: these always run everything, Markdown included.
              src/* | e2e/* | drizzle/* | scripts/* | public/* | assets/* | .github/*) app=true ;;
              docs/* | *.md) ;;
              # Config files, package*.json and anything unknown.
              *) app=true ;;
            esac
          done <<<"$files"
          echo "app=$app" >>"$GITHUB_OUTPUT"
          {
            if [ "$app" = true ]; then
              echo "Runs every check: this pull request changes more than documentation."
            else
              echo "Documentation only: the build, tests, end-to-end, Lighthouse and migration checks pass without running. Formatting, secret scan and pull request hygiene still run."
            fi
            echo
            echo '```'
            echo "$files"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  verify:
    name: Lint, types, tests, build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      APP: ${{ needs.changes.outputs.app != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Prettier also checks Markdown, so it runs on documentation changes too.
      - run: npm run format:check
      - if: env.APP == 'true'
        run: npm run lint
      - if: env.APP == 'true'
        run: npm run typecheck
      - if: env.APP == 'true'
        run: npm run test:coverage
      - name: Restore the Next.js build cache
        if: env.APP == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'assets/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: next-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # A build with no database to read, the way src/lib/static-params.ts
      # falls back when one cannot be reached. The placeholder connects nowhere.
      - name: Build without a database
        if: env.APP == 'true'
        run: npm run build
        env:
          # Placeholders that pass validation (src/lib/env.ts). The build only
          # checks their shape; nothing connects to them. Real values live in Vercel.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
          BETTER_AUTH_URL: http://localhost:3000
      - name: Documentation only, nothing else to check
        if: env.APP != 'true'
        run: echo "Only documentation changed; formatting passed."

  build:
    # One build per check, each made the way that check made its own before,
    # and shared by all of that check's shards.
    name: Production build for ${{ matrix.check }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Both builds read the seeded league, as production builds against
          # the real database, so the public seasons and teams are
          # prerendered (src/lib/static-params.ts): the flows check that their
          # actions refresh those pages, and Lighthouse measures them as
          # served. The seed is deterministic, so each shard seeds the same
          # league again.
          - check: end-to-end
            artifact: next-build-e2e
            database: kickball_e2e_demo
            address: http://localhost:3100
            seed: true
          - check: Lighthouse
            artifact: next-build-lighthouse
            database: ci
            address: http://localhost:3200
            seed: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ${{ matrix.database }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/${{ matrix.database }}
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
      BETTER_AUTH_URL: ${{ matrix.address }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - if: matrix.seed
        run: npm run seed
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ matrix.artifact }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'assets/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: ${{ matrix.artifact }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - name: Pack the build (without its cache)
        run: tar --zstd -cf next-build.tar.zst --exclude=.next/cache .next
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: next-build.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1

  e2e-shard:
    name: End-to-end shard ${{ matrix.shard }} of 2
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # "demo" in the name lets the flows sign in with one-tap view-as.
          POSTGRES_DB: kickball_e2e_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      # Stripe's own mock API, so checkout runs without reaching Stripe.
      stripe:
        image: stripe/stripe-mock:v0.197.0
        ports: ["12111:12111"]
    env:
      # A throwaway database in the service container; playwright.config.ts
      # adds demo mode and placeholder Stripe test values for the flows server.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/kickball_e2e_demo
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
      BETTER_AUTH_URL: http://localhost:3100
      # Start the shared build instead of building again.
      E2E_PREBUILT: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: next-build-e2e
      - run: tar --zstd -xf next-build.tar.zst && rm next-build.tar.zst
      - run: npm run db:migrate
      - name: Smoke tests and core flows with axe (seeds the database first)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      # Read-only and paused change the site for every test at once, so the
      # operator's site-wide switches run alone, after the rest, on one shard.
      - name: The operator's site-wide switches (reseeds the database first)
        if: matrix.shard == 1
        run: npm run test:e2e:site-wide
      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: End-to-end
    needs: [changes, build, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$CHANGES" = success ] && [ "$APP" = false ]; then
            echo "Only documentation changed; no end-to-end run needed."
            exit 0
          fi
          echo "Production build: $BUILD. End-to-end shards: $SHARDS."
          [ "$BUILD" = success ] && [ "$SHARDS" = success ]

  lighthouse-shard:
    name: Lighthouse shard ${{ matrix.shard }} of 3
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The same seeded league its build was prerendered from.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
      BETTER_AUTH_URL: http://localhost:3200
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run seed
      - uses: actions/download-artifact@v8
        with:
          name: next-build-lighthouse
      - run: tar --zstd -xf next-build.tar.zst && rm next-build.tar.zst
      - name: This shard's pages, with every budget in lighthouserc.json
        run: node scripts/lighthouse-shard.mjs ${{ matrix.shard }} 3
      - name: Performance and accessibility budgets (throttled phone)
        run: npm run lighthouse -- --config=.lighthouseci/shard.json
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ matrix.shard }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: [changes, build, lighthouse-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          APP: ${{ needs.changes.outputs.app }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.lighthouse-shard.result }}
        run: |
          if [ "$CHANGES" = success ] && [ "$APP" = false ]; then
            echo "Only documentation changed; no Lighthouse run needed."
            exit 0
          fi
          echo "Production build: $BUILD. Lighthouse shards: $SHARDS."
          [ "$BUILD" = success ] && [ "$SHARDS" = success ]

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not just this commit
      - name: No tokens, keys or passwords anywhere in the history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1

  migrations:
    name: Migrations
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    services:
      # Same major version as the Neon project. An empty image starts no
      # container, for a documentation-only change.
      postgres:
        image: ${{ needs.changes.outputs.app != 'false' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      APP: ${{ needs.changes.outputs.app != 'false' }}
    steps:
      - name: Documentation only, nothing to migrate
        if: env.APP != 'true'
        run: echo "Only documentation changed; the migration checks pass without running."
      - if: env.APP == 'true'
        uses: actions/checkout@v7
      - if: env.APP == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.APP == 'true'
        run: npm ci
      - name: Migration files are consistent
        if: env.APP == 'true'
        run: npm run db:check
      - name: Schema has no changes without a migration
        if: env.APP == 'true'
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema changed without a migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Every migration applies to an empty database
        if: env.APP == 'true'
        run: npm run db:migrate
      - name: Migrations are idempotent on re-run
        if: env.APP == 'true'
        run: npm run db:migrate
      - name: Database constraints hold
        if: env.APP == 'true'
        run: npm run test:db
      - name: Seed data loads into a fresh database, twice
        if: env.APP == 'true'
        run: npm run seed && npm run seed
