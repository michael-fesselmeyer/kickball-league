name: Outbox sweep

# Sends messages timed for later, such as a game day's decision-time
# reminder, close to their time. Vercel Hobby runs the outbox job once a
# day; this calls the same route every 15 minutes through the league's
# day (12:00 to 04:45 UTC: 8 am to past midnight in New York), which is
# free in a public repository (docs/architecture.md, section 5). It does
# nothing until the site's address (the SITE_URL variable) and the
# CRON_SECRET secret are set.

on:
  schedule:
    - cron: "*/15 12-23 * * *"
    - cron: "*/15 0-4 * * *"
  workflow_dispatch:

concurrency:
  group: outbox-sweep
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    name: Send what is due
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The secret goes in a header, never the address, and nothing the
      # route answers is printed.
      - name: Call the outbox job
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --output /dev/null \
            "$SITE_URL/api/jobs/outbox"
