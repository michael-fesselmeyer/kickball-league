name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL or environment (local, preview, demo, production), device and browser.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, console errors or logs. Remove any personal data first.
