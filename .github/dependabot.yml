version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for routine minor and patch updates; majors arrive alone
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types must match the Node runtime (24.x); bump them with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next.js's ESLint config and typed linting do not support these
      # majors yet. Revisit when Next.js does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
