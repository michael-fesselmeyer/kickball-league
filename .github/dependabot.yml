version: 2
# Fits the project's flow: at most one routine update pull request per
# ecosystem a week, on Monday, with Conventional Commit titles. CI checks
# each one like any other pull request, and green ones are merged.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # One pull request for routine minor and patch updates; majors arrive alone
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types must match the Node runtime (24.x); bump them with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next.js's ESLint config and typed linting do not support these
      # majors yet. Revisit when Next.js does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      # All workflow action updates together in one pull request.
      actions:
        patterns: ["*"]
