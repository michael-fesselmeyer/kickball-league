<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kickball</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    box-sizing: border-box;
    background: #FBF8F1;
    color: #14182B;
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin: 0; }
  p { margin: 0; max-width: 22rem; color: #4A5068; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 2.75rem;
    padding: 0 1.25rem;
    border: 2px solid #14182B;
    border-radius: 0.75rem;
    background: #1F3A8A;
    color: #FFFFFF;
    font-weight: 700;
    text-decoration: none;
  }
  a:focus-visible { outline: 3px solid #1F3A8A; outline-offset: 2px; }
</style>
</head>
<body>
<h1>Opening the league…</h1>
<p><a href="http://localhost:3000/app">Open the league</a></p>
<script>location.replace("http://localhost:3000/app");</script>
</body>
</html>
